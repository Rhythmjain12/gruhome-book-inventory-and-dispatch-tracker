name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # also allow manual runs from the Actions tab

# Minimal scope — we only need to read the repo and use OIDC for telemetry.
permissions:
  contents: read

# Cancel any in-flight deploy if a new push lands — avoids race-on-Cloudflare.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Build frontend
        run: npx vite build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler reads the project's wrangler.toml automatically.
          command: deploy
