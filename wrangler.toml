# This file IS committed to the public repo. Anything secret lives in
# Cloudflare via `wrangler secret put <NAME>` and is never echoed here.
# See SETUP.md for the full env var list.

name = "gruhome"
main = "worker/index.ts"
compatibility_date = "2025-01-15"

# Serve the built React SPA from /dist. The Worker handles /api/* and
# /approve; everything else falls back to index.html for the SPA.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Daily overdue reminder — 09:00 IST = 03:30 UTC (IST = UTC+5:30, no DST).
[triggers]
crons = ["30 3 * * *"]

# Runtime-editable config (salespeople, approver names, admin PIN).
# On first read after this namespace is empty, the worker seeds it from
# env vars; after that, KV is the source of truth and the Settings UI
# writes to it.
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "d8f25367fc3f4e549c9584969d408517"

# ---------------------------------------------------------------------
# All env vars (secrets AND non-secrets) live in Cloudflare, set via
# `wrangler secret put <NAME>` or the dashboard. We deliberately keep
# them OUT of this file so:
#   1. The public repo never leaks values (even non-sensitive ones like
#      staff names).
#   2. The founder can edit values in the Cloudflare dashboard without
#      needing a code commit + deploy.
#
# Expected env vars (see SETUP.md for what each does):
#   NOTION_TOKEN
#   NOTION_CATALOGUE_DB_ID
#   NOTION_DISPATCH_DB_ID
#   ADMIN_PIN
#   PUMBLE_WEBHOOK_URL          (optional — empty to disable Pumble)
#   PUMBLE_WEBHOOK_URL_STAFF    (optional — empty to disable Pumble)
#   APP_BASE_URL
#   SALESPEOPLE
#   APPROVER_1_NAME
#   APPROVER_2_NAME
# ---------------------------------------------------------------------
